    <script>
      // Theme bootstrap (runs before first paint). Light is the default for
      // anyone without a saved choice. Storage key is versioned (v2) so an old
      // saved value (e.g. "system" or "dark" from an earlier visit) can't
      // silently override the light default. Storage can be blocked (private
      // mode / strict privacy), so every access is guarded.
      (function () {
        var stored = 'light'
        try {
          stored = localStorage.getItem('theme-v2') || 'light'
        } catch (e) {}
        var resolved = stored
        if (stored === 'system') {
          resolved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        if (resolved !== 'dark') resolved = 'light'
        document.documentElement.setAttribute('data-theme', resolved)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#070f1d' : '#f7fafd')
      })()
    </script>
